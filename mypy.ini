[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
disallow_untyped_decorators = False
no_implicit_optional = False
warn_redundant_casts = True
warn_unused_ignores = False
warn_no_return = False
warn_unreachable = False
strict_equality = False
exclude = tests_archive/.*|scripts/.*

# Allow missing imports for third-party libraries without stubs
[mypy-nautilus_trader.*]
ignore_missing_imports = True

[mypy-setuptools.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-kraken.*]
ignore_missing_imports = True
# The strategies submodule's own tests alias classes via pytest.importorskip, which mypy
# cannot treat as types. They belong to that repo, not to the src/core type check.
[mypy-src.core.strategies.custom.tests.*]
ignore_errors = True
