name: CI

# Fast lane: runs on every PR and push to main. Target: under 8 minutes wall clock.
#
# Each test tier runs once, in parallel, and writes its own coverage data file.
# The coverage job only *combines* those files; it never re-runs the suite.
# (The old "Combined Coverage Report" job re-ran all ~7,400 tests without --forked.
# It took 15 minutes on the critical path and caused the red builds on main.)
#
# Slow and advisory checks (Python 3.12, mypy, bandit/safety) live in nightly.yml.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "archive/**"
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_bmad/**"
      - "_bmad-output/**"
      - "archive/**"
  workflow_dispatch:

concurrency:
  # A new push to the same PR cancels the run that is already in flight.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash # explicit bash adds -o pipefail; the implicit default does not

env:
  PYTHON_VERSION: "3.11" # matches .python-version
  # nautilus_trader's .so files request an executable stack; glibc >= 2.41 refuses
  # to load them without this (same setting as the Makefile and Dockerfile, #41).
  GLIBC_TUNABLES: glibc.rtld.execstack=2
  DATABASE_URL: postgresql://ntrader_dev_2025:ntrader_dev_2025@localhost:5432/trading_ntrader_dev

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --dev
      - name: Ruff format check (locked ruff version, same as local)
        run: uv run ruff format --check --diff .
      - name: Ruff lint (includes the F401/F821 import gate)
        run: uv run ruff check . --output-format=github

  tests:
    name: Tests (${{ matrix.tier }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a hung test fails the job instead of holding it
    strategy:
      fail-fast: false # one red tier should not hide the others' results
      matrix:
        include:
          - tier: unit
            args: tests/unit -n auto
          - tier: component
            args: tests/component -n auto
          - tier: integration
            args: tests/integration -n auto --forked # Nautilus C extensions need --forked

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ntrader_dev_2025
          POSTGRES_PASSWORD: ntrader_dev_2025
          POSTGRES_DB: trading_ntrader_dev
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
      # Required by tests/integration/core/test_live_cache_namespace.py. Without
      # Redis it skips itself, and Story 2.4's AC #4 / FR19 would go unproven.
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies (locked)
        run: uv sync --frozen --dev

      - name: Run database migrations
        if: matrix.tier == 'integration'
        run: uv run alembic upgrade head

      - name: Run ${{ matrix.tier }} tests
        env:
          COVERAGE_FILE: .coverage.${{ matrix.tier }}
        run: |
          uv run pytest ${{ matrix.args }} -m "not quarantine" \
            --cov=src --cov-report= \
            -q -ra --tb=short --durations=15

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.tier }}
          path: .coverage.${{ matrix.tier }}
          include-hidden-files: true
          retention-days: 3

  coverage:
    name: Coverage (combine, ≥64%)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: coverage-data
          merge-multiple: true
      - name: Combine and enforce threshold
        run: |
          uvx coverage combine coverage-data/
          uvx coverage xml
          uvx coverage report --fail-under=64 --skip-covered --sort=cover | tail -25
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
