{#
  Metadata-panel skeleton: an animate-pulse placeholder matching the card,
  shown only during the initial deep-link auto-load. OOB chart-panel responses
  swap the real panel in without flashing.
#}
<div class="mt-6" aria-hidden="true">
    <div class="bg-slate-900 rounded-lg border border-slate-800 px-4 py-4">
        <div class="animate-pulse bg-slate-800 h-4 w-24 rounded mb-3"></div>
        <div class="grid grid-cols-[repeat(auto-fit,minmax(160px,1fr))] gap-3">
            {% for _ in range(8) %}
            <div>
                <div class="animate-pulse bg-slate-800 h-3 w-16 rounded"></div>
                <div class="animate-pulse bg-slate-800 h-4 w-24 rounded mt-2"></div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
