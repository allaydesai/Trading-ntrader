{#
  Supplementary-panel skeleton: three animate-pulse placeholder sections that
  match the collapsed <details> shape. Shown only during the initial deep-link
  auto-load; OOB chart-panel responses swap the real panel in without flashing.
#}
<div class="mt-6 space-y-3" aria-hidden="true">
    {% for _ in range(3) %}
    <div class="bg-slate-900 rounded-lg border border-slate-800 px-4 py-3">
        <div class="animate-pulse bg-slate-800 h-4 w-40 rounded"></div>
    </div>
    {% endfor %}
</div>
