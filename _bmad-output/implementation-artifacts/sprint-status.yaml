last_updated: >-
  2026-08-11 (Story 1.5 implemented -> code-reviewed -> done. Delivers REALTIME/RTH market-data
  configuration, the market-data line budget check, and the LiveBarObserver actor that subscribes,
  logs every bar with its instrument and timestamp, paces its subscriptions at the existing 45 req/s
  discipline, and notices a delayed feed. Split across src/core/live_market_data.py (pure policy) and
  src/core/live_bar_observer.py (the actor); live_node_builder.py gained bar_types/bar_observer and now
  passes market_data_type + use_regular_trading_hours explicitly with an AST guard proving it, since
  the adapter's own defaults happen to agree today and would otherwise mask a missing kwarg.
  93 new component tests, 5 unit, 1 integration; ruff + mypy clean; the pre-existing 23-failure
  integration baseline is unchanged. The three-layer adversarial review earned its keep twice over.
  (1) CRITICAL: the delayed-data guard would have shut down a HEALTHY session every RTH re-open — the
  IB adapter republishes the previous bar stamped with the current wall clock, so the first bar after
  an overnight gap looks ~17.5 hours late against a 180s threshold, and a multi-day paper session (the
  point of this phase) would have killed itself every morning. Fixed at the root by discarding
  republished bars, plus a consecutive-offender requirement as defence in depth. (2) CRITICAL: paced
  dispatch died silently after batch 2 on a real LiveClock — a fired one-shot timer is still listed
  while its callback runs, so re-arming the same name raised a KeyError that Nautilus swallows, while
  TestClock pops the timer first and kept all four pacing tests green. Fixed with a fresh timer name
  per batch and verified against a real LiveClock. Also found: ts_event is the bar's OPEN not its
  close, which made the documented "blind spot above ~13-minute intervals" simply false (the interval
  cancels; the guard works on hourly bars) — the story's own retraction is recorded rather than
  quietly corrected. Live evidence: Procedure P2 ran against the paper Gateway on 127.0.0.1:4002 and
  met pass criteria 1 and 2 (REALTIME confirmed in the gateway log, AAPL.NASDAQ qualified and loaded,
  subscription accepted, no IB 10167); criterion 3 (a bar actually delivered) is NOT met because the
  market was closed, and the probe reported that as a failure rather than printing ok — a re-run
  during RTH is logged as the outstanding item. Six items deferred, incl. the zero-delivery blind spot
  (-> Story 1.6, which owns the trading-permission flag) and LiveClock's cross-thread callbacks
  (-> Epic 2's runner). Epic 1: 1.1/1.2/1.3/1.5 done, 1.4/1.6/1.7 remain.
